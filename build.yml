name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - name: Build
        run: |
          flutter create --platforms=android --org com.castplayer --project-name castplayer /tmp/app
          cp main.dart dlna.dart browser.dart /tmp/app/lib/
          cp pubspec.yaml patch_android.py /tmp/app/
          cd /tmp/app
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/><uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/><application android:usesCleartextTraffic="true"#' $M
          python3 patch_android.py
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              if [[ "$f" == *.kts ]]; then
                printf '\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n' >> "$f"
              else
                printf '\nandroid {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n' >> "$f"
              fi
            fi
          done
          flutter pub get
          find ~/.pub-cache -path '*flutter_inappwebview_android*/android/build.gradle' -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/' {} +
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: castplayer-apk
          path: /tmp/app/build/app/outputs/flutter-apk/app-release.apk
